[package]
name = "ethereum-block-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
jeth-core = { path = "../core", default-features = false, features = [
  "portable",
  "code-library",
  "guest-instrument",
] }
linked_list_allocator = { version = "=0.10.6", default-features = false }
critical-section = "1.2"
postcard = { version = "1.0.8", default-features = false }

[patch.crates-io]
revm-interpreter = { path = "../vendor/revm-interpreter" }
alloy-eip7702 = { path = "../vendor/alloy-eip7702" }
foldhash = { path = "../vendor/foldhash" }
alloy-primitives = { path = "../vendor/alloy-primitives" }
hashbrown = { path = "../vendor/hashbrown" }
ark-ff = { path = "../vendor/ark-ff" }

[patch."https://github.com/paradigmxyz/stateless.git"]
zeth-mpt = { path = "../vendor/zeth-mpt" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
