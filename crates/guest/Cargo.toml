[package]
name = "jeth-guest"
version = "0.1.0"
edition = "2021"

# Standalone package: the original guest uses the Jolt CLI with `--features guest`.
# The portable library uses `--no-default-features --features portable` and lets
# its embedding runtime supply the entry point, allocator, and device IO.
# Isolation keeps guest-only crypto choices out of native host builds.
[workspace]

[features]
default = ["keccak-census", "jolt-runtime"]
guest = ["jeth-core/code-library", "jolt-runtime"]
# Portable library entry point; select with --no-default-features.
portable = ["jeth-core/portable", "jeth-core/code-library"]
# custom-0 words 0xc200000b / 0xc200100b; state in a0, message in a1.
custom0-keccak = ["portable", "alloy-primitives/native-keccak"]
jolt-runtime = [
  "dep:jolt",
  "dep:jolt-inlines-keccak256",
  "dep:revm-interpreter",
  "dep:alloy-eip7702",
  "alloy-primitives/native-keccak",
  "jeth-core/advice-tape",
  "jeth-core/secp-inline",
  "jeth-core/sha2-inline",
  "jeth-core/blake2-inline",
  "jeth-core/blake2f-inline",
  "jeth-core/p256-inline",
  "jeth-core/bigint-inline",
  "jeth-core/bn254-inline",
  "jeth-core/bls12-381-inline",
  "jeth-core/guest-instrument",
]
# Keccak census: per-call counters + `keccak[phase]` println lines in the
# normal `jeth trace` output (the `perms=` count is a campaign gate). Costs
# 21 rows per keccak call; `--no-default-features` drops it.
keccak-census = []
# Per-transaction cycle markers (drives `jeth txprofile`).
pertx = ["jeth-core/pertx-markers"]
# Defer bytecode analysis to first execution (A/B measurement for R2).
lazy = ["jeth-core/lazy-analysis"]
# Advice two-pass, pass-1 build (see jeth-core/compute_advice). The two builds
# are different ELFs; trace.rs builds and runs both.
compute_advice = ["jeth-core/compute_advice"]

[dependencies]
jolt = { package = "jolt-sdk", git = "https://github.com/a16z/jolt", rev = "8e536f199735ac8187156aa589ed1387722a079a", optional = true }
jolt-inlines-keccak256 = { git = "https://github.com/a16z/jolt", rev = "8e536f199735ac8187156aa589ed1387722a079a", default-features = false, optional = true }

jeth-core = { path = "../core", default-features = false }
alloy-eip7702 = { version = "0.6.3", default-features = false, features = [
  "jolt-inline",
], optional = true }
# Direct dependency only to reach the vendored crate's `bigint-inline` feature:
# EVM MULMOD through the `jeth_mul_mod` hook in lib.rs in Jolt runtime builds.
revm-interpreter = { version = "35.0.1", default-features = false, features = [
  "bigint-inline",
], optional = true }

# `native-keccak` routes every alloy keccak256 call (trie hashing, tx hashing, EVM
# KECCAK256 opcode, address derivation) to our `native_keccak256` shim → Jolt inline.
alloy-primitives = { version = "1.5", default-features = false }

# once_cell(critical-section) inside reth-primitives-traits needs a provider on
# bare metal; the Jolt guest is single-hart with no interrupts → no-op impl.
critical-section = "1.2"

# Word-wise Stack::exchange (SWAP1-16 measured at 16.9% of trace rows via the
# untyped byte-swap codegen). One-function patch.
#
# alloy-eip7702: EIP-7702 authority recovery routed through the Jolt secp256k1
# inline via the guest's jeth_ecrecover_prehash hook (software k256 measured at
# ~1.5M rows/authorization — 16% of block 25698070; the inline is ~230k).
[patch.crates-io]
revm-interpreter = { path = "../vendor/revm-interpreter" }
alloy-eip7702 = { path = "../vendor/alloy-eip7702" }
# Fixed foldhash seeds (design law L5): hashbrown iteration order must be
# identical across the compute_advice/proven ELF pair — upstream seeds from
# stack/fn/static addresses, which differ between two ELFs. Guest-only patch.
foldhash = { path = "../vendor/foldhash" }
# alloy-primitives: `FbHasher::write` (every Address/B256/U256 map key in revm and
# jeth) reads its key chunks byte-wise on riscv64 (8 `lbu` + shifts per 8-byte word,
# about 46 rows); the vendored copy gathers them from the containing aligned words.
# Guest-only patch; hashes are bit-identical so native parity holds by construction.
alloy-primitives = { path = "../vendor/alloy-primitives" }
# hashbrown 0.17 (alloy-primitives + indexmap maps): `Group::load` reads the 8 ctrl
# bytes of every probe unaligned (8 `lbu` + shifts on riscv64); the vendored copy
# gathers them from the containing aligned words. Guest-only, no semantic change.
hashbrown = { path = "../vendor/hashbrown" }
# ark-ff with the bn254 and BLS12-381 inline hooks (jeth-core `bn254-inline`, `bls12-381-inline`):
# replaces the registry crate for revm-precompile, ark-ec, ark-bn254, ark-bls12-381 and jeth-core;
# the jolt crates' a16z fork is a different source.
ark-ff = { path = "../vendor/ark-ff" }

# zeth-mpt fork: inline slot children (digest stubs unboxed), in-place node
# decode + zero-copy values (Bytes::slice_ref views into witness node bytes) —
# decode-driven struct moves + value copies measured ~190M rows across
# reveal/execution/post_root. Same patch in the root workspace so the native
# gate runs identical trie code.
[patch."https://github.com/paradigmxyz/stateless.git"]
zeth-mpt = { path = "../vendor/zeth-mpt" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "jeth-guest"
path = "src/main.rs"
required-features = ["jolt-runtime"]
test = false
bench = false
